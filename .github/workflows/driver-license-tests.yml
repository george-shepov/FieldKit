name: Driver License Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, REV001]
    paths:
      - 'drivers-license/**'
      - 'shared/f1-help-nav.js'
      - 'tests/drivers-license.spec.js'
      - 'playwright.driver-license.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/driver-license-tests.yml'
  push:
    branches: [main, REV001]
    paths:
      - 'drivers-license/**'
      - 'shared/f1-help-nav.js'
      - 'tests/drivers-license.spec.js'
      - 'playwright.driver-license.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/driver-license-tests.yml'

permissions:
  contents: read

jobs:
  driver-license:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Driver License tests
        run: npm run test:driver-license

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: driver-license-playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
