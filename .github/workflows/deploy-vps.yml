name: Deploy FieldKit demo to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldkit-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    # A push deploy can only begin after the CI workflow for main passed. Manual
    # dispatch remains available for a controlled re-deploy of the current main.
    if: >-
      vars.FIELDKIT_VPS_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.FIELDKIT_VPS_HOST }}
      DEPLOY_USER: ${{ secrets.FIELDKIT_VPS_USER }}
      DEPLOY_PORT: ${{ secrets.FIELDKIT_VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.FIELDKIT_VPS_PATH }}
      KNOWN_HOSTS: ${{ secrets.FIELDKIT_VPS_KNOWN_HOSTS }}
      SSH_KEY: ${{ secrets.FIELDKIT_VPS_SSH_KEY }}
      PUBLIC_URL: ${{ vars.FIELDKIT_DEMO_URL || 'https://fieldkit.giorgiy.org' }}
      VERSION_MAJOR: ${{ vars.FIELDKIT_VERSION_MAJOR || '1' }}
      VERSION_MINOR: ${{ vars.FIELDKIT_VERSION_MINOR || '0' }}

    steps:
      - name: Choose the verified commit
        id: commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploy enabled: ${{ vars.FIELDKIT_VPS_DEPLOY_ENABLED }}"
          echo "Public URL: $PUBLIC_URL"
          echo "Deploy port: $DEPLOY_PORT"
          echo "Version line: $VERSION_MAJOR.$VERSION_MINOR.x"
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH KNOWN_HOSTS SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "A required FieldKit VPS GitHub secret is missing ($name)." >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_PATH" == /* ]] || { echo 'FIELDKIT_VPS_PATH must be absolute.' >&2; exit 1; }
          [[ "$VERSION_MAJOR" =~ ^[0-9]+$ ]] || { echo 'FIELDKIT_VERSION_MAJOR must be an integer.' >&2; exit 1; }
          [[ "$VERSION_MINOR" =~ ^[0-9]+$ ]] || { echo 'FIELDKIT_VERSION_MINOR must be an integer.' >&2; exit 1; }

      - name: Configure trusted SSH connection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Determine next deployment version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_BUILD="$(ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' VERSION_MAJOR='$VERSION_MAJOR' VERSION_MINOR='$VERSION_MINOR' bash -s" <<'REMOTE'
          set -euo pipefail
          release_file="${DEPLOY_PATH}/current/fieldkit-release.json"
          if [[ ! -f "$release_file" ]]; then
            echo 0
            exit 0
          fi
          python3 - "$release_file" "$VERSION_MAJOR" "$VERSION_MINOR" <<'PY'
          import json
          import sys

          path, expected_major, expected_minor = sys.argv[1:]
          try:
              release = json.load(open(path, encoding='utf-8'))
              major = str(release.get('major', ''))
              minor = str(release.get('minor', ''))
              build = int(release.get('build', 0))
              # Reset the build counter when major or minor is deliberately changed.
              print(build if major == expected_major and minor == expected_minor else 0)
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              print(0)
          PY
          REMOTE
          )"
          [[ "$CURRENT_BUILD" =~ ^[0-9]+$ ]] || { echo "Invalid current build: $CURRENT_BUILD" >&2; exit 1; }
          NEXT_BUILD=$((CURRENT_BUILD + 1))
          VERSION="$VERSION_MAJOR.$VERSION_MINOR.$NEXT_BUILD"
          echo "build=$NEXT_BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying FieldKit $VERSION"

      - name: Build immutable static release
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
          DEPLOY_VERSION: ${{ steps.version.outputs.version }}
          DEPLOY_BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          mkdir release
          git archive --format=tar "$DEPLOY_SHA" | tar -x -C release
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > release/fieldkit-release.json <<EOF
          {"version":"$DEPLOY_VERSION","major":$VERSION_MAJOR,"minor":$VERSION_MINOR,"build":$DEPLOY_BUILD,"commit":"$DEPLOY_SHA","built_at":"$BUILT_AT","source":"github-actions"}
          EOF

          # Add a small, non-invasive version badge to the VPS release. It reads
          # fieldkit-release.json so the UI always reports the release actually served.
          python3 - <<'PY'
          from pathlib import Path

          index = Path('release/index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<script id="fieldkit-release-badge">'
          if marker not in html:
              badge = r'''
          <script id="fieldkit-release-badge">
          (() => {
            const render = (release) => {
              const badge = document.createElement('a');
              badge.href = './fieldkit-release.json';
              badge.title = `Built ${release.built_at || 'unknown'} from ${release.commit || 'unknown'}`;
              badge.textContent = `FieldKit ${release.version || 'dev'}`;
              badge.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:90;padding:6px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(9,9,11,.86);backdrop-filter:blur(8px);color:#a1a1aa;font:600 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-decoration:none;box-shadow:0 6px 24px rgba(0,0,0,.25)';
              document.body.appendChild(badge);
            };
            fetch(`./fieldkit-release.json?t=${Date.now()}`, { cache: 'no-store' })
              .then((response) => response.ok ? response.json() : Promise.reject(new Error(String(response.status))))
              .then(render)
              .catch(() => render({ version: 'dev' }));
          })();
          </script>
          '''
              html = html.replace('</body>', badge + '\n</body>')
              index.write_text(html, encoding='utf-8')
          PY

          tar -C release -czf fieldkit-release.tar.gz .

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 \
            fieldkit-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/fieldkit-release-${{ steps.commit.outputs.sha }}.tar.gz"

      - name: Activate release atomically
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/fieldkit-release-${DEPLOY_SHA}.tar.gz"
          releases="${DEPLOY_PATH}/releases"
          release="${releases}/${DEPLOY_SHA}"
          staging="${releases}/.${DEPLOY_SHA}.staging"

          test -f "$archive"
          install -d -m 0755 "$releases"
          rm -rf "$staging"
          install -d -m 0755 "$staging"
          tar -xzf "$archive" -C "$staging"
          test -f "$staging/index.html"
          test -f "$staging/fieldkit-release.json"
          rm -rf "$release"
          mv "$staging" "$release"
          ln -s "$release" "${DEPLOY_PATH}/.current-next"
          mv -Tf "${DEPLOY_PATH}/.current-next" "${DEPLOY_PATH}/current"
          rm -f "$archive"
          find "$releases" -mindepth 1 -maxdepth 1 -type d -name '[0-9a-f]*' -printf '%T@ %p\n' |
            sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

      - name: Verify the public demo release
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
          DEPLOY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 3 \
            -H 'Cache-Control: no-cache' "$PUBLIC_URL/fieldkit-release.json?sha=$DEPLOY_SHA" -o fieldkit-release.json
          cat fieldkit-release.json
          grep -Fq "$DEPLOY_SHA" fieldkit-release.json
          grep -Fq "\"version\":\"$DEPLOY_VERSION\"" fieldkit-release.json
