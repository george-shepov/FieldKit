<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Vocabulary Expander · FieldKit</title>
  <link rel="stylesheet" href="../shared/shadcn.css">
  <link rel="stylesheet" href="/Vocabulary-Expander/vocabulary-toolkit.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      color: #e5e7eb;
      background: radial-gradient(circle at 15% 0%, rgba(37,99,235,.2), transparent 35%), #09090b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1050px, calc(100% - 2rem)); margin: 0 auto; padding: 1rem 0 3rem; }
    .hero { padding: 1.5rem 0 1rem; }
    .hero h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.6rem); letter-spacing: -.04em; }
    .hero p { color: #a1a1aa; max-width: 760px; line-height: 1.6; }
    .dependency-warning { border: 1px solid #7f1d1d; background: rgba(127,29,29,.18); border-radius: 12px; padding: 1rem; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1>Vocabulary Expander</h1>
      <p>Offline-oriented vocabulary estimation, developer/legal terminology checks, and an unfamiliar-word collector. Results use the same browser profile as the standalone app and Developer Interview Prep.</p>
    </header>
    <div id="vocabularyToolkit"></div>
  </main>

  <script src="/Vocabulary-Expander/vocabulary-toolkit.js"></script>
  <script>
    const root = document.getElementById('vocabularyToolkit');
    if (window.VocabularyToolkit) {
      window.VocabularyToolkit.mount(root, {
        defaultBank: 'general',
        showReader: true,
        sourceLabel: 'FieldKit',
        homeHref: '../index.html',
        fullAppHref: '/Vocabulary-Expander/',
        sampleText: 'FieldKit combines offline tools, training applications, legal references, emergency utilities, and developer practice. Tap any word you do not recognize to add it to your shared learning queue.'
      });
    } else {
      root.innerHTML = '<div class="dependency-warning"><strong>Vocabulary module unavailable.</strong><p>Open this page once while online after the Vocabulary-Expander source app is deployed. FieldKit will then cache the shared module for later use.</p><p><a href="/Vocabulary-Expander/">Open Vocabulary Expander</a></p></div>';
    }
  </script>
  <script src="../shared/pwa-init.js"></script>
</body>
</html>
