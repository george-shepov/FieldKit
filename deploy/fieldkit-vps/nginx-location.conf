# Include this inside the existing HTTPS server block for fieldkit.giorgiy.org.
# When Nginx runs in Docker, bind-mount /srv/fieldkit at the same path first.

root /srv/fieldkit/current;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location = /fieldkit-release.json {
    add_header Cache-Control "no-store" always;
}
