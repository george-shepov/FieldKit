<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Developer Interview Prep | FieldKit</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#111116;--line:#27272f;--text:#f5f5f7;--muted:#a1a1aa;--accent:#6366f1}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(9,9,11,.96)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#2563eb);display:grid;place-items:center;font-weight:800}.title{min-width:0}.title strong{display:block}.title span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}a{color:inherit;text-decoration:none}.btn{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent)}
    main{min-height:0;position:relative}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}iframe{position:relative;width:100%;height:100%;border:0;background:#0f172a}
    @media(max-width:700px){header{align-items:flex-start;flex-direction:column}.title span{white-space:normal}nav{width:100%;justify-content:stretch}.btn{flex:1;text-align:center}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">FK</div>
      <div class="title"><strong>Developer Interview Prep</strong><span>FieldKit Training Lab · searchable questions, decks, notes, bookmarks and offline support</span></div>
    </div>
    <nav>
      <a class="btn" href="../">← FieldKit</a>
      <a class="btn" href="https://github.com/george-shepov/developer-interview-prep" target="_blank" rel="noopener">Source</a>
      <a class="btn primary" href="https://george-shepov.github.io/developer-interview-prep/" target="_blank" rel="noopener">Open full screen ↗</a>
    </nav>
  </header>
  <main>
    <div class="loading">Loading interview question decks…</div>
    <iframe title="Developer Interview Prep" src="https://george-shepov.github.io/developer-interview-prep/" allow="clipboard-read; clipboard-write"></iframe>
  </main>
</body>
</html>
